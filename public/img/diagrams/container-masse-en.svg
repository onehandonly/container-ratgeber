<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="'Inter', system-ui, Arial, sans-serif" role="img" aria-label="Dimensioned drawing of 20 ft and 40 ft containers">
  <defs>
    <pattern id="corrEN" width="18" height="12" patternUnits="userSpaceOnUse">
      <rect width="18" height="12" fill="#e8f0fe"/>
      <rect x="0" width="6" height="12" fill="#cfe0fb"/>
    </pattern>
    <marker id="arrEN" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8Z" fill="#37435c"/></marker>
  </defs>

  <text x="40" y="46" font-size="26" font-weight="800" fill="#0e1626">Container dimensions compared</text>
  <text x="40" y="72" font-size="15" fill="#6b7793">External dimensions (approx.) · standard height · high cube +0.30 m</text>

  <!-- 40 ft -->
  <g>
    <rect x="120" y="120" width="620" height="150" rx="6" fill="url(#corrEN)" stroke="#2f4fd0" stroke-width="2.5"/>
    <g fill="#2f4fd0">
      <rect x="120" y="120" width="16" height="18"/><rect x="724" y="120" width="16" height="18"/>
      <rect x="120" y="252" width="16" height="18"/><rect x="724" y="252" width="16" height="18"/>
    </g>
    <text x="430" y="205" font-size="22" font-weight="800" fill="#1b2b6b" text-anchor="middle">40 ft</text>
    <line x1="120" y1="300" x2="740" y2="300" stroke="#37435c" stroke-width="1.5" marker-start="url(#arrEN)" marker-end="url(#arrEN)"/>
    <line x1="120" y1="272" x2="120" y2="308" stroke="#37435c" stroke-width="1"/>
    <line x1="740" y1="272" x2="740" y2="308" stroke="#37435c" stroke-width="1"/>
    <rect x="388" y="288" width="84" height="24" fill="#fff"/>
    <text x="430" y="305" font-size="16" font-weight="700" fill="#0e1626" text-anchor="middle">12.192 m</text>
    <line x1="775" y1="120" x2="775" y2="270" stroke="#37435c" stroke-width="1.5" marker-start="url(#arrEN)" marker-end="url(#arrEN)"/>
    <line x1="747" y1="120" x2="783" y2="120" stroke="#37435c" stroke-width="1"/>
    <line x1="747" y1="270" x2="783" y2="270" stroke="#37435c" stroke-width="1"/>
    <text x="792" y="200" font-size="16" font-weight="700" fill="#0e1626">2.591 m</text>
  </g>

  <!-- 20 ft -->
  <g>
    <rect x="120" y="360" width="310" height="150" rx="6" fill="url(#corrEN)" stroke="#0e93a8" stroke-width="2.5"/>
    <g fill="#0e93a8">
      <rect x="120" y="360" width="16" height="18"/><rect x="414" y="360" width="16" height="18"/>
      <rect x="120" y="492" width="16" height="18"/><rect x="414" y="492" width="16" height="18"/>
    </g>
    <text x="275" y="445" font-size="22" font-weight="800" fill="#0b6b7a" text-anchor="middle">20 ft</text>
    <line x1="120" y1="540" x2="430" y2="540" stroke="#37435c" stroke-width="1.5" marker-start="url(#arrEN)" marker-end="url(#arrEN)"/>
    <line x1="120" y1="512" x2="120" y2="548" stroke="#37435c" stroke-width="1"/>
    <line x1="430" y1="512" x2="430" y2="548" stroke="#37435c" stroke-width="1"/>
    <rect x="233" y="528" width="84" height="24" fill="#fff"/>
    <text x="275" y="545" font-size="16" font-weight="700" fill="#0e1626" text-anchor="middle">6.058 m</text>
  </g>

  <!-- Width / legend -->
  <g transform="translate(560 360)">
    <rect x="0" y="0" width="380" height="150" rx="10" fill="#f4f6fb" stroke="#dbe1ee"/>
    <text x="22" y="34" font-size="15" font-weight="800" fill="#0e1626">More dimensions (approx.)</text>
    <text x="22" y="66" font-size="15" fill="#37435c">Width:</text><text x="170" y="66" font-size="15" font-weight="700" fill="#0e1626">2.438 m</text>
    <text x="22" y="94" font-size="15" fill="#37435c">Height standard:</text><text x="170" y="94" font-size="15" font-weight="700" fill="#0e1626">2.591 m</text>
    <text x="22" y="122" font-size="15" fill="#37435c">Height high cube:</text><text x="170" y="122" font-size="15" font-weight="700" fill="#0e1626">2.896 m</text>
  </g>
</svg>
